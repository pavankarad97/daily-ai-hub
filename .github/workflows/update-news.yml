name: Daily AI Hub News Update

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Indian and Global News
        run: |
          python3 <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timezone

          feeds = [
              ("India", "India latest news", "en"),
              ("India", "भारत की ताज़ा खबरें", "hi"),
              ("India", "महाराष्ट्र ताज़ा खबरें", "mr"),
              ("India", "தமிழ்நாடு செய்திகள்", "ta"),
              ("India", "తెలుగు వార్తలు", "te"),
              ("India", "বাংলা সংবাদ", "bn"),
              ("India", "ಕನ್ನಡ ಸುದ್ದಿ", "kn"),
              ("India", "മലയാളം വാർത്തകൾ", "ml"),
              ("India", "ગુજરાત સમાચાર", "gu"),
              ("India", "ਪੰਜਾਬੀ ਖ਼ਬਰਾਂ", "pa"),

              ("Trending", "India trending news", "en"),
              ("Trending", "भारत trending news", "hi"),

              ("World", "world latest news", "en"),

              ("Cricket", "cricket latest news", "en"),
              ("Cricket", "भारत क्रिकेट", "hi"),

              ("Technology", "technology latest news", "en"),
              ("AI", "artificial intelligence AI latest", "en"),

              ("Movies", "Indian movies latest news", "en"),
              ("Movies", "Bollywood latest news", "hi"),
              ("Movies", "South Indian movies latest", "en"),
          ]

          news = []
          seen = set()

          for category, query, language in feeds:
              try:
                  q = urllib.parse.quote(query)

                  if language == "hi":
                      hl, gl, ceid = "hi", "IN", "IN:hi"
                  elif language == "mr":
                      hl, gl, ceid = "mr", "IN", "IN:mr"
                  elif language == "ta":
                      hl, gl, ceid = "ta", "IN", "IN:ta"
                  elif language == "te":
                      hl, gl, ceid = "te", "IN", "IN:te"
                  elif language == "bn":
                      hl, gl, ceid = "bn", "IN", "IN:bn"
                  elif language == "kn":
                      hl, gl, ceid = "kn", "IN", "IN:kn"
                  elif language == "ml":
                      hl, gl, ceid = "ml", "IN", "IN:ml"
                  elif language == "gu":
                      hl, gl, ceid = "gu", "IN", "IN:gu"
                  elif language == "pa":
                      hl, gl, ceid = "pa", "IN", "IN:pa"
                  else:
                      hl, gl, ceid = "en-IN", "IN", "IN:en"

                  url = (
                      "https://news.google.com/rss/search?"
                      f"q={q}&hl={hl}&gl={gl}&ceid={ceid}"
                  )

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  data = urllib.request.urlopen(
                      req, timeout=20
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item")[:8]:
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      pub = item.findtext("pubDate", "").strip()

                      if not title or not link:
                          continue

                      key = title.lower()

                      if key in seen:
                          continue

                      seen.add(key)

                      news.append({
                          "title": title,
                          "link": link,
                          "date": pub,
                          "category": category,
                          "language": language,
                          "source": "Google News"
                      })

              except Exception as e:
                  print("Feed error:", query, e)

          result = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "total": len(news),
              "news": news
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("News collected:", len(news))
          PY

      - name: Save News
        run: |
          git config user.name "Daily AI Hub Bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Auto update news"
          git push
