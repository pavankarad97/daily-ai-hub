<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily AI Hub</title>

<meta name="description"
content="Daily AI Hub - India, World, Cricket, Technology, AI and Movies latest news">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b14;
  color:#fff;
}

button,
input{
  font-family:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#0d1220;
  border-bottom:1px solid #26344f;
  padding:15px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#55c7ff;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.language{
  background:#172238;
  border:1px solid #30405d;
  color:#fff;
  padding:10px 12px;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

.language option{
  background:#111a2b;
  color:#fff;
}

.menu{
  background:#172238;
  border:1px solid #30405d;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-size:22px;
}

nav{
  display:none;
  position:absolute;
  right:15px;
  top:65px;
  width:220px;
  background:#111a2b;
  border:1px solid #30405d;
  border-radius:12px;
  padding:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

nav.show{
  display:block;
}

nav button{
  width:100%;
  padding:12px;
  margin-bottom:5px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#fff;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

nav button:hover{
  background:#243451;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px 50px;
}

.hero{
  background:linear-gradient(135deg,#101a32,#111827);
  border:1px solid #263958;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#aebbd0;
  font-size:18px;
  line-height:1.5;
}

.status{
  margin-top:15px;
  color:#69e6a5;
  font-size:14px;
}

.search{
  width:100%;
  padding:14px;
  margin:20px 0;
  border-radius:10px;
  border:1px solid #334563;
  background:#101827;
  color:#fff;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:#55c7ff;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:22px;
  padding-bottom:5px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories button{
  white-space:nowrap;
  border:1px solid #344866;
  background:#121c2e;
  color:#fff;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
  font-size:15px;
}

.categories button.active{
  background:#1677b8;
  border-color:#1677b8;
}

.section-title{
  font-size:22px;
  margin-bottom:15px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:#101827;
  border:1px solid #263958;
  border-radius:14px;
  padding:17px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#4c8bc1;
}

.badge{
  display:inline-block;
  font-size:12px;
  background:#193b62;
  color:#66c9ff;
  padding:5px 8px;
  border-radius:6px;
  margin-bottom:10px;
}

.card h2{
  font-size:18px;
  line-height:1.4;
  margin-bottom:10px;
}

.card p{
  color:#9eacc0;
  font-size:13px;
  margin-bottom:12px;
  line-height:1.5;
}

.read{
  display:inline-block;
  border:0;
  background:#1677b8;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.read:hover{
  background:#1d8ed0;
}

.loading,
.empty{
  text-align:center;
  padding:40px 10px;
  color:#9eacc0;
}

.loading{
  grid-column:1/-1;
}

footer{
  text-align:center;
  padding:25px;
  border-top:1px solid #26344f;
  color:#7e8da5;
  font-size:13px;
}


/* ================================
   ARTICLE PAGE
================================ */

#articlePage{
  display:none;
}

.article-wrap{
  max-width:900px;
  margin:auto;
}

.back-btn{
  display:inline-block;
  background:#172238;
  border:1px solid #30405d;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:18px;
  font-size:14px;
}

.article-card{
  background:#101827;
  border:1px solid #263958;
  border-radius:18px;
  padding:25px;
}

.article-category{
  display:inline-block;
  background:#193b62;
  color:#66c9ff;
  padding:6px 10px;
  border-radius:7px;
  font-size:13px;
  margin-bottom:15px;
}

.article-title{
  font-size:32px;
  line-height:1.35;
  margin-bottom:15px;
}

.article-meta{
  color:#8797af;
  font-size:14px;
  margin-bottom:25px;
}

.article-heading{
  font-size:20px;
  margin:25px 0 12px;
  color:#55c7ff;
}

.article-summary{
  color:#d8e0ec;
  font-size:17px;
  line-height:1.8;
}

.source-box{
  margin-top:30px;
  padding:18px;
  background:#0b111e;
  border:1px solid #293b59;
  border-radius:12px;
}

.source-box h3{
  margin-bottom:14px;
}

.source-link{
  display:block;
  color:#63c9ff;
  text-decoration:none;
  padding:9px 0;
  line-height:1.5;
}

.source-link:hover{
  text-decoration:underline;
}

.article-note{
  margin-top:20px;
  color:#8999b1;
  font-size:12px;
  line-height:1.6;
}


/* ================================
   MOBILE
================================ */

@media(max-width:700px){

  .header{
    flex-wrap:wrap;
  }

  .header-right{
    margin-left:auto;
  }

  .language{
    max-width:125px;
  }

  .news-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:27px;
  }

  .hero p{
    font-size:17px;
  }

  .article-title{
    font-size:25px;
  }

  .article-card{
    padding:19px;
  }

  .article-summary{
    font-size:16px;
  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="container">

<section class="hero">

</h1>

</p>

/>

<script>


/* =========================================
   GLOBAL DATA
========================================= */

let allNews = [];

let currentCategory = "All";

let selectedLanguage = "en";

let refreshTimer = null;



/* =========================================
   LOAD NEWS
========================================= */

async function loadNews(){

const box =
document.getElementById("news");

try{

const response =
await fetch(
"./news.json?time=" + Date.now(),
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"news.json not found"
);

}

const data =
await response.json();


allNews =
Array.isArray(data)
? data
: (data.news || []);


if(!Array.isArray(allNews)){

allNews = [];

}


renderNews(
getFilteredNews()
);


const updated =
data.updated
? formatDate(data.updated)
: "Just now";


document.getElementById(
"updateStatus"
).innerText =
"● Updated: " + updated;


}catch(error){

console.log(
"News error:",
error
);

box.innerHTML = `

<div class="empty">

<h3>
⚠️ News load नहीं हो सकी
</h3>

<p style="margin-top:10px;">
कृपया थोड़ी देर बाद फिर कोशिश करें।
</p>

<button
class="read"
style="margin-top:15px;"
onclick="loadNews()">
🔄 Retry
</button>

</div>

`;

document.getElementById(
"updateStatus"
).innerText =
"News update failed";

}

}



/* =========================================
   RENDER NEWS
========================================= */

function renderNews(list){

const box =
document.getElementById("news");


if(!list.length){

box.innerHTML = `

<div class="empty">

कोई news नहीं मिली।

</div>

`;

return;

}


box.innerHTML = list
.map((item,index)=>{

const title =
escapeHTML(
getTitle(item)
);

const category =
escapeHTML(
item.category || "News"
);

const source =
escapeHTML(
item.source || "News Source"
);

const date =
escapeHTML(
item.date || ""
);


return `

<article class="card">

<span class="badge">
${category}
</span>

<h2>
${title}
</h2>

<p>
${source}
${date ? " • " + date : ""}
</p>

<button
class="read"
onclick="openArticle(${index})">

Read News →
</button>

</article>

`;

})
.join("");

}



/* =========================================
   FILTER
========================================= */

function filterNews(
category,
button
){

currentCategory =
category;


document
.querySelectorAll(
".categories button"
)
.forEach(btn =>
btn.classList.remove(
"active"
)
);


if(button){

button.classList.add(
"active"
);

}


document.getElementById(
"search"
).value = "";


renderNews(
getFilteredNews()
);

}



/* =========================================
   FILTERED NEWS
========================================= */

function getFilteredNews(){

let list = allNews;


if(currentCategory !== "All"){

list =
list.filter(item =>

String(
item.category || ""
)
.toLowerCase()
.includes(
currentCategory.toLowerCase()
)

);

}


if(selectedLanguage !== "all"){

const languageList =
list.filter(item =>

String(
item.language || ""
)
.toLowerCase()
===
selectedLanguage.toLowerCase()

);


/*
