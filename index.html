<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily AI Hub</title>

<meta name="description"
content="Daily AI Hub - Latest India, World, Cricket, Technology, AI and Movies News">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b14;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:999;
  background:#0d1220;
  border-bottom:1px solid #26344f;
}

.header{
  max-width:1150px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logo span{
  color:#55c7ff;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.language{
  background:#172238;
  color:#fff;
  border:1px solid #344866;
  padding:9px;
  border-radius:9px;
  outline:none;
}

.menu{
  background:#172238;
  color:#fff;
  border:1px solid #344866;
  padding:9px 13px;
  border-radius:9px;
  font-size:18px;
}

nav{
  display:none;
  position:absolute;
  right:15px;
  top:62px;
  width:230px;
  background:#111a2b;
  border:1px solid #30405d;
  border-radius:12px;
  padding:10px;
}

nav.show{
  display:block;
}

nav button{
  width:100%;
  border:0;
  background:transparent;
  color:white;
  padding:12px;
  text-align:left;
  border-radius:8px;
  font-size:15px;
}

nav button:hover{
  background:#243451;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 16px 60px;
}

.hero{
  background:linear-gradient(135deg,#101a32,#111827);
  border:1px solid #293b5c;
  border-radius:20px;
  padding:28px;
  margin-bottom:22px;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  color:#aebbd0;
  font-size:17px;
  line-height:1.6;
}

.status{
  margin-top:15px;
  color:#69e6a5;
}

.updated{
  margin-top:7px;
  color:#8190a8;
  font-size:12px;
}

.search{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:1px solid #334563;
  background:#101827;
  color:white;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-bottom:25px;
  padding-bottom:5px;
}

.categories button{
  white-space:nowrap;
  background:#121c2e;
  border:1px solid #344866;
  color:white;
  padding:10px 15px;
  border-radius:22px;
}

.categories button.active{
  background:#167fc2;
  border-color:#167fc2;
}

.section-title{
  font-size:25px;
  margin-bottom:17px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  background:#101827;
  border:1px solid #263958;
  border-radius:15px;
  padding:18px;
}

.badge{
  display:inline-block;
  background:#193b62;
  color:#67ccff;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  margin-bottom:10px;
}

.card h2{
  font-size:19px;
  line-height:1.45;
  margin-bottom:9px;
}

.card p{
  color:#96a6bd;
  font-size:13px;
  line-height:1.5;
}

.read{
  display:inline-block;
  margin-top:14px;
  color:#63c9ff;
  font-weight:bold;
  text-decoration:none;
}

.loading,
.empty{
  text-align:center;
  padding:45px 10px;
  color:#98a7bd;
  grid-column:1/-1;
}

.article{
  max-width:850px;
  margin:auto;
  background:#101827;
  border:1px solid #293b5c;
  border-radius:18px;
  padding:25px;
}

.back{
  background:#172238;
  color:#fff;
  border:1px solid #344866;
  padding:10px 15px;
  border-radius:9px;
  margin-bottom:18px;
}

.article h1{
  font-size:31px;
  line-height:1.4;
  margin:12px 0;
}

.meta{
  color:#8fa0b8;
  font-size:13px;
  margin-bottom:22px;
}

.summary{
  background:#111e34;
  border-left:4px solid #55c7ff;
  padding:18px;
  border-radius:10px;
  margin:20px 0;
}

.summary h3{
  color:#55c7ff;
  margin-bottom:10px;
}

.summary p{
  color:#d5dce8;
  line-height:1.8;
  font-size:16px;
}

.sources{
  margin-top:25px;
  padding:18px;
  border:1px solid #30405d;
  border-radius:12px;
}

.sources h3{
  margin-bottom:10px;
}

.sources a{
  display:block;
  color:#63c9ff;
  text-decoration:none;
  margin-top:10px;
  word-break:break-word;
}

footer{
  border-top:1px solid #26344f;
  text-align:center;
  color:#7f8da4;
  padding:25px;
  font-size:13px;
}

@media(max-width:700px){

  .news-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:28px;
  }

  .article h1{
    font-size:25px;
  }

  .logo{
    font-size:20px;
  }

  .language{
    max-width:105px;
  }

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
Daily <span>AI Hub</span>
</div>

<div class="controls">

<select id="language"
class="language"
onchange="changeLanguage()">

<option value="en">🇬🇧 English</option>
<option value="hi">🇮🇳 हिन्दी</option>
<option value="mr">मराठी</option>
<option value="ta">தமிழ்</option>
<option value="te">తెలుగు</option>
<option value="bn">বাংলা</option>
<option value="kn">ಕನ್ನಡ</option>
<option value="ml">മലയാളം</option>
<option value="gu">ગુજરાતી</option>
<option value="pa">ਪੰਜਾਬੀ</option>

</select>

<button class="menu"
onclick="toggleMenu()">☰</button>

</div>

<nav id="nav">

<button onclick="filterNews('All')">🏠 Home</button>
<button onclick="filterNews('India')">🇮🇳 India</button>
<button onclick="filterNews('World')">🌎 World</button>
<button onclick="filterNews('Trending')">🔥 Trending</button>
<button onclick="filterNews('Cricket')">🏏 Cricket</button>
<button onclick="filterNews('Technology')">💻 Technology</button>
<button onclick="filterNews('AI')">🤖 AI</button>
<button onclick="filterNews('Movies')">🎬 Movies</button>

</nav>

</div>

</header>


<main class="container">

<section id="homePage">

<div class="hero">

<h1>📰 Daily AI Hub</h1>

<p>
India, World, Cricket, Technology, AI और Movies की latest news
</p>

<div class="status">
● LIVE NEWS
</div>

<div id="updated"
class="updated">
News loading...
</div>

</div>


<input
id="search"
class="search"
placeholder="🔍 News search करें..."
oninput="searchNews()">


<div class="categories">

<button class="active"
onclick="filterNews('All',this)">
All
</button>

<button onclick="filterNews('India',this)">
🇮🇳 India
</button>

<button onclick="filterNews('World',this)">
🌎 World
</button>

<button onclick="filterNews('Trending',this)">
🔥 Trending
</button>

<button onclick="filterNews('Cricket',this)">
🏏 Cricket
</button>

<button onclick="filterNews('Technology',this)">
💻 Technology
</button>

<button onclick="filterNews('AI',this)">
🤖 AI
</button>

<button onclick="filterNews('Movies',this)">
🎬 Movies
</button>

</div>


<h2 class="section-title">
🔥 Latest News
</h2>

<div id="news"
class="news-grid">

<div class="loading">
News loading...
</div>

</div>

</section>


<section id="articlePage"
style="display:none">

<button class="back"
onclick="goHome()">
← Back to News
</button>

<div id="articleContent"></div>

</section>

</main>


<footer>
© 2026 Daily AI Hub • News & Information
</footer>


<script>

let allNews=[];
let currentCategory="All";

let selectedLanguage=
localStorage.getItem(
"dailyAI_language"
) || "en";

let lastNewsHash="";


document.getElementById(
"language"
).value=selectedLanguage;


/* -------------------------
   LOAD NEWS
------------------------- */

async function loadNews(){

try{

const response=
await fetch(
"./news.json?cache="+
Date.now(),
{
cache:"no-store"
}
);

if(!response.ok)
throw new Error("News file error");

const data=
await response.json();

const newNews=
Array.isArray(data)
?data
:(data.news || []);

const newHash=
JSON.stringify(newNews);

if(newHash !== lastNewsHash){

allNews=newNews;

lastNewsHash=newHash;

renderNews(
getFilteredNews()
);

}

document.getElementById(
"updated"
).textContent=
"● Updated: "+
(
data.updated
?
new Date(
data.updated
).toLocaleString()
:
"Just now"
);

}catch(error){

console.log(error);

if(!allNews.length){

document.getElementById(
"news"
).innerHTML=
`
<div class="empty">
News अभी उपलब्ध नहीं है।
</div>
`;

}

}

}


/* -------------------------
   FILTERED NEWS
------------------------- */

function getFilteredNews(){

let list=allNews;

if(currentCategory!=="All"){

list=
list.filter(item=>
String(
item.category || ""
)
.toLowerCase()
.includes(
currentCategory.toLowerCase()
)
);

}

const search=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

if(search){

list=
list.filter(item=>
getTitle(item)
.toLowerCase()
.includes(search)
);

}

return list;

}


/* -------------------------
   TITLE
------------------------- */

function getTitle(item){

if(
item.translations &&
item.translations[
selectedLanguage
] &&
item.translations[
selectedLanguage
].title
){

return item.translations[
selectedLanguage
].title;

}

return item.title || "News";

}


/* -------------------------
   SUMMARY
------------------------- */

function getSummary(item){

if(
item.translations &&
item.translations[
selectedLanguage
] &&
item.translations[
selectedLanguage
].summary
){

return item.translations[
selectedLanguage
].summary;

}

return item.summary || "";

}


/* -------------------------
   RENDER
------------------------- */

function renderNews(list){

const box=
document.getElementById("news");

if(!list.length){

box.innerHTML=
`
<div class="empty">
कोई news नहीं मिली।
</div>
`;

return;

}


/*
   हर 1 सेकंड नई available
   news दिखाने के लिए rotation
*/

const max=
list.length;

if(!window.rotationIndex)
window.rotationIndex=0;

const visibleCount=
Math.min(12,max);

let cards=[];

for(
let i=0;
i<visibleCount;
i++
){

const index=
(
window.rotationIndex+i
)%max;

const item=
list[index];

cards.push({

item:item,
index:index

});

}
