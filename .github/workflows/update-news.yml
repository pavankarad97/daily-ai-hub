name: Daily AI News Update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AI News
        run: |
          python3 <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timezone

          feeds = [
              "https://news.google.com/rss/search?q=artificial+intelligence+AI&hl=en-US&gl=US&ceid=US:en",
              "https://news.google.com/rss/search?q=OpenAI+OR+Google+AI+OR+Microsoft+AI&hl=en-US&gl=US&ceid=US:en"
          ]

          news = []
          seen = set()

          for url in feeds:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  data = urllib.request.urlopen(
                      request,
                      timeout=20
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      pub = item.findtext("pubDate", "").strip()
                      source = item.findtext("source", "Google News").strip()

                      if not title or not link:
                          continue

                      key = title.lower()

                      if key in seen:
                          continue

                      seen.add(key)

                      news.append({
                          "title": title,
                          "link": link,
                          "date": pub,
                          "source": source
                      })

                      if len(news) >= 12:
                          break

              except Exception as e:
                  print("Feed error:", e)

              if len(news) >= 12:
                  break

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "count": len(news),
              "articles": news[:12]
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("News articles:", len(news))
          PY

      - name: Save Updated News
        run: |
          git config user.name "Daily AI Hub Bot"
          git config user.email "actions@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update daily AI news"
            git push
          fi
