<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily AI Hub</title>

<meta name="description"
content="Daily AI Hub - Latest India, World, Cricket, Technology, AI and Movies News">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070b14;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#0d1220;
  border-bottom:1px solid #26344f;
}

.header{
  max-width:1150px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logo span{
  color:#55c7ff;
}

.right{
  display:flex;
  align-items:center;
  gap:10px;
}

.language{
  background:#172238;
  color:#fff;
  border:1px solid #344866;
  padding:9px;
  border-radius:9px;
  outline:none;
}

.menu{
  background:#172238;
  color:#fff;
  border:1px solid #344866;
  padding:9px 13px;
  border-radius:9px;
  font-size:18px;
}

nav{
  display:none;
  position:absolute;
  right:15px;
  top:62px;
  width:220px;
  background:#111a2b;
  border:1px solid #30405d;
  border-radius:12px;
  padding:10px;
}

nav.show{
  display:block;
}

nav button{
  width:100%;
  border:0;
  background:transparent;
  color:white;
  padding:12px;
  text-align:left;
  border-radius:8px;
  font-size:15px;
}

nav button:hover{
  background:#243451;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 16px 60px;
}

.hero{
  background:linear-gradient(135deg,#111c35,#111827);
  border:1px solid #293b5c;
  border-radius:20px;
  padding:28px;
  margin-bottom:22px;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  color:#aebbd0;
  font-size:17px;
  line-height:1.6;
}

.status{
  color:#68e6a3;
  margin-top:16px;
}

.updated{
  color:#8190a8;
  font-size:12px;
  margin-top:8px;
}

.search{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:1px solid #334563;
  background:#101827;
  color:white;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:25px;
}

.categories button{
  white-space:nowrap;
  background:#121c2e;
  border:1px solid #344866;
  color:white;
  padding:10px 15px;
  border-radius:22px;
}

.categories button.active{
  background:#167fc2;
  border-color:#167fc2;
}

.section-title{
  font-size:25px;
  margin-bottom:17px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  background:#101827;
  border:1px solid #263958;
  border-radius:15px;
  padding:18px;
}

.card:hover{
  border-color:#55c7ff;
}

.badge{
  display:inline-block;
  background:#193b62;
  color:#67ccff;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  margin-bottom:10px;
}

.card h2{
  font-size:19px;
  line-height:1.45;
  margin-bottom:9px;
}

.card p{
  color:#96a6bd;
  font-size:13px;
  line-height:1.5;
}

.read{
  display:inline-block;
  margin-top:14px;
  color:#63c9ff;
  font-weight:bold;
  text-decoration:none;
}

.card .source{
  margin-top:5px;
}

.loading,
.empty{
  text-align:center;
  padding:45px 10px;
  color:#98a7bd;
}

.article{
  background:#101827;
  border:1px solid #293b5c;
  border-radius:18px;
  padding:25px;
}

.article h1{
  font-size:31px;
  line-height:1.35;
  margin:12px 0;
}

.article-meta{
  color:#8fa0b8;
  font-size:13px;
  margin-bottom:20px;
}

.ai-summary{
  background:#111e34;
  border-left:4px solid #55c7ff;
  padding:18px;
  border-radius:10px;
  margin:20px 0;
}

.ai-summary h3{
  margin-bottom:10px;
  color:#55c7ff;
}

.ai-summary p{
  color:#d5dce8;
  line-height:1.7;
}

.source-box{
  margin-top:25px;
  padding:18px;
  border:1px solid #30405d;
  border-radius:12px;
}

.source-box a{
  color:#63c9ff;
  text-decoration:none;
  display:block;
  margin-top:8px;
  word-break:break-word;
}

.back{
  background:#172238;
  color:white;
  border:1px solid #344866;
  padding:10px 15px;
  border-radius:9px;
  margin-bottom:15px;
}

footer{
  border-top:1px solid #26344f;
  text-align:center;
  color:#7f8da4;
  padding:25px;
  font-size:13px;
}

@media(max-width:700px){

  .news-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:28px;
  }

  .article h1{
    font-size:25px;
  }

  .logo{
    font-size:20px;
  }

  .language{
    max-width:105px;
  }
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
Daily <span>AI Hub</span>
</div>

<div class="right">

<select id="language" class="language"
onchange="changeLanguage()">

<option value="en">🇬🇧 English</option>
<option value="hi">🇮🇳 हिन्दी</option>
<option value="mr">मराठी</option>
<option value="ta">தமிழ்</option>
<option value="te">తెలుగు</option>
<option value="bn">বাংলা</option>
<option value="kn">ಕನ್ನಡ</option>
<option value="ml">മലയാളം</option>
<option value="gu">ગુજરાતી</option>
<option value="pa">ਪੰਜਾਬੀ</option>

</select>

<button class="menu" onclick="toggleMenu()">☰</button>

</div>

<nav id="nav">

<button onclick="filterNews('All')">🏠 Home</button>
<button onclick="filterNews('India')">🇮🇳 India</button>
<button onclick="filterNews('World')">🌎 World</button>
<button onclick="filterNews('Cricket')">🏏 Cricket</button>
<button onclick="filterNews('Technology')">💻 Technology</button>
<button onclick="filterNews('AI')">🤖 AI</button>
<button onclick="filterNews('Movies')">🎬 Movies</button>
<button onclick="filterNews('Trending')">🔥 Trending</button>

</nav>

</div>

</header>

<main class="container">

<section id="homePage">

<div class="hero">

<h1>📰 Daily AI Hub</h1>

<p>
India, World, Cricket, Technology, AI और Movies की latest news
</p>

<div class="status">
● Live News Updates
</div>

<div id="updated" class="updated">
Updating...
</div>

</div>

<input
id="search"
class="search"
placeholder="🔍 News search करें..."
oninput="searchNews()">

<div class="categories">

<button class="active"
onclick="filterNews('All',this)">
All
</button>

<button onclick="filterNews('India',this)">
🇮🇳 India
</button>

<button onclick="filterNews('World',this)">
🌎 World
</button>

<button onclick="filterNews('Cricket',this)">
🏏 Cricket
</button>

<button onclick="filterNews('Technology',this)">
💻 Technology
</button>

<button onclick="filterNews('AI',this)">
🤖 AI
</button>

<button onclick="filterNews('Movies',this)">
🎬 Movies
</button>

<button onclick="filterNews('Trending',this)">
🔥 Trending
</button>

</div>

<h2 class="section-title">
🔥 Latest News
</h2>

<div id="news" class="news-grid">

<div class="loading">
News loading...
</div>

</div>

</section>


<section id="articlePage" style="display:none">

<button class="back" onclick="goHome()">
← Back to News
</button>

<div id="articleContent"></div>

</section>

</main>

<footer>
© 2026 Daily AI Hub • News & Information
</footer>


<script>

let allNews=[];
let currentCategory="All";
let selectedLanguage=
localStorage.getItem("dailyAI_language") || "en";

document.getElementById("language").value=selectedLanguage;


const TEXT={

en:{
summary:"AI News Summary",
source:"Full Article – Original Source",
back:"← Back to News",
loading:"Loading news...",
updated:"Last updated"
},

hi:{
summary:"AI न्यूज़ सारांश",
source:"पूरा लेख – मूल स्रोत",
back:"← न्यूज़ पर वापस जाएँ",
loading:"न्यूज़ लोड हो रही है...",
updated:"अंतिम अपडेट"
},

mr:{
summary:"AI बातमी सारांश",
source:"संपूर्ण लेख – मूळ स्रोत",
back:"← बातम्यांकडे परत",
loading:"बातम्या लोड होत आहेत...",
updated:"शेवटचे अपडेट"
},

ta:{
summary:"AI செய்தி சுருக்கம்",
source:"முழு கட்டுரை – அசல் மூலம்",
back:"← செய்திகளுக்கு திரும்பு",
loading:"செய்திகள் ஏற்றப்படுகின்றன...",
updated:"கடைசி புதுப்பிப்பு"
},

te:{
summary:"AI వార్తా సారాంశం",
source:"పూర్తి కథనం – అసలు మూలం",
back:"← వార్తలకు తిరిగి",
loading:"వార్తలు లోడ్ అవుతున్నాయి...",
updated:"చివరి నవీకరణ"
},

bn:{
summary:"AI সংবাদ সারাংশ",
source:"সম্পূর্ণ নিবন্ধ – মূল উৎস",
back:"← সংবাদে ফিরে যান",
loading:"সংবাদ লোড হচ্ছে...",
updated:"সর্বশেষ আপডেট"
},

kn:{
summary:"AI ಸುದ್ದಿ ಸಾರಾಂಶ",
source:"ಪೂರ್ಣ ಲೇಖನ – ಮೂಲ ಮೂಲ",
back:"← ಸುದ್ದಿಗೆ ಹಿಂತಿರುಗಿ",
loading:"ಸುದ್ದಿ ಲೋಡ್ ಆಗುತ್ತಿದೆ...",
updated:"ಕೊನೆಯ ಅಪ್‌ಡೇಟ್"
},

ml:{
summary:"AI വാർത്താ സംഗ്രഹം",
source:"പൂർണ്ണ ലേഖനം – യഥാർത്ഥ ഉറവിടം",
back:"← വാർത്തകളിലേക്ക് മടങ്ങുക",
loading:"വാർത്തകൾ ലോഡ് ചെയ്യുന്നു...",
updated:"അവസാന അപ്‌ഡേറ്റ്"
},

gu:{
summary:"AI સમાચાર સારાંશ",
source:"સંપૂર્ણ લેખ – મૂળ સ્ત્રોત",
back:"← સમાચાર પર પાછા",
loading:"સમાચાર લોડ થઈ રહ્યા છે...",
updated:"છેલ્લું અપડેટ"
},

pa:{
summary:"AI ਖ਼ਬਰਾਂ ਦਾ ਸਾਰ",
source:"ਪੂਰਾ ਲੇਖ – ਅਸਲ ਸਰੋਤ",
back:"← ਖ਼ਬਰਾਂ 'ਤੇ ਵਾਪਸ",
loading:"ਖ਼ਬਰਾਂ ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ...",
updated:"ਆਖਰੀ ਅੱਪਡੇਟ"
}

};


async function loadNews(){

try{

const response=
await fetch("./news.json?t="+Date.now());

if(!response.ok)
throw new Error("news.json error");

const data=await response.json();

allNews=
Array.isArray(data)
?data
:(data.news || []);

document.getElementById("updated").innerText=
TEXT[selectedLanguage].updated+
": "+
(data.updated
?new Date(data.updated).toLocaleString()
:"Just now");

renderNews(allNews);

}catch(e){

document.getElementById("news").innerHTML=
`
<div class="empty">
<h3>News अभी उपलब्ध नहीं है</h3>
<p>थोड़ी देर बाद फिर कोशिश करें।</p>
</div>
`;

}

}


function getTitle(item){

if(item.translations &&
item.translations[selectedLanguage] &&
item.translations[selectedLanguage].title){

return item.translations[selectedLanguage].title;

}

return item.title || "News";

}


function getSummary(item){

if(item.translations &&
item.translations[selectedLanguage] &&
item.translations[selectedLanguage].summary){

return item.translations[selectedLanguage].summary;

}

return item.summary || "";

}


function renderNews(list){

const box=document.getElementById("news");

if(!list.length){

box.innerHTML=
`<div class="empty">कोई news नहीं मिली।</div>`;

return;

}

box.innerHTML=list.map((item,index)=>{

const title=escapeHTML(getTitle(item));

const category=
escapeHTML(item.category || "News");

const source=
escapeHTML(item.source || "News Source");

const date=
escapeHTML(item.date || "");

const summary=
escapeHTML(getSummary(item));

return `

<article class="card">

<span class="badge">
${category}
</span>

<h2>${title}</h2>

<p class="source">
${source}${date ? " • "+date : ""}
</p>

${summary
?`<p style="margin-top:10px">
${summary.substring(0,180)}...
</p>`
:""}

<a class="read"
href="?article=${encodeURIComponent(item.id || index)}">
Read Full News →
</a>

</article>

`;

}).join("");

}


function openArticle(){

const params=
new URLSearchParams(window.location.search);

const id=params.get("article");

if(id===null)
return;

const index=
parseInt(id);

const item=
allNews[index];

if(!item){

goHome();
return;

}

document.getElementById("homePage").style.display="none";

document.getElementById("articlePage").style.display="block";

const title=
escapeHTML(getTitle(item));

const summary=
escapeHTML(getSummary(item));

const source=
escapeHTML(item.source || "Original Source");

const date=
escapeHTML(item.date || "");

const link=
item.originalLink || item.link || "#";

document.getElementById("articleContent").innerHTML=

`

<div class="article">

<span class="badge">
${escapeHTML(item.category || "News")}
</span>

<h1>${title}</h1>

<div class="article-meta">
${source}${date ? " • "+date : ""}
</div>

<div class="ai-summary">

<h3>
🤖 ${TEXT[selectedLanguage].summary}
</h3>

<p>
${summary || "इस खबर का AI summary अभी तैयार नहीं है।"}
</p>

</div>

<div class="source-box">

<strong>
🔗 ${TEXT[selectedLanguage].source}
</strong>

<a href="${escapeAttr(link)}"
target="_blank"
rel="noopener noreferrer">
${link}
</a>

</div>

</div>

`;

}


function goHome(){

history.pushState({}, "", "./");

document.getElementById("articlePage").style.display="none";

document.getElementById("homePage").style.display="block";

}


window.addEventListener("popstate",function(){

location.reload();

});


function filterNews(category,button){

currentCategory=category;

document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

if(button)
button.classList.add("active");

let list=allNews;

if(category!=="All"){

list=list.filter(item=>
String(item.category || "")
.toLowerCase()
.includes(category.toLowerCase())
);

}

renderNews(list);

}


function searchNews(){

const text=
document.getElementById("search")
.value
.toLowerCase()
.trim();

let list=allNews;

if(currentCategory!=="All"){

list=list.filter(item=>
String(item.category || "")
.toLowerCase()
.includes(currentCategory.toLowerCase())
);

}

if(text){

list=list.filter(item=>

String(getTitle(item))
.toLowerCase()
.includes(text)

);

}

renderNews(list);

}


function changeLanguage(){

selectedLanguage=
document.getElementById("language").value;

localStorage.setItem(
"dailyAI_language",
selectedLanguage
);

renderNews(allNews);

openArticle();

}


function toggleMenu(){

document
.getElementById("nav")
.classList.toggle("show");

}


function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


/* AUTO REFRESH
   Every 10 minutes
*/

setInterval(()=>{

loadNews();

},10*60*1000);


/* Initial load */

loadNews();

setTimeout(()=>{

openArticle();

},500);

</script>

</body>
</html>
