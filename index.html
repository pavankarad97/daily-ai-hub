<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Daily Utility Hub - Free Online Calculators & Tools</title>

<meta name="description"
content="Free online calculators and useful tools for EMI, GST, salary, percentage, age, BMI, area and more.">

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.5;
}

header{
background:#101828;
color:white;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header{
max-width:1100px;
margin:auto;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:23px;
font-weight:800;
}

.logo span{
color:#39bdf8;
}

.menu{
background:#24324a;
border:1px solid #40516c;
color:white;
padding:9px 13px;
border-radius:8px;
font-size:20px;
cursor:pointer;
}

nav{
display:none;
position:absolute;
right:15px;
top:65px;
width:230px;
background:#101828;
border:1px solid #34445d;
border-radius:12px;
padding:10px;
}

nav.show{
display:block;
}

nav button{
width:100%;
padding:12px;
background:transparent;
border:0;
color:white;
text-align:left;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

nav button:hover{
background:#24324a;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 15px 50px;
}

.hero{
background:linear-gradient(135deg,#101828,#1d3557);
color:white;
border-radius:18px;
padding:30px 25px;
margin-bottom:25px;
}

.hero h1{
font-size:32px;
margin-bottom:8px;
}

.hero p{
color:#c8d3e2;
font-size:16px;
}

.search{
width:100%;
padding:15px;
border:1px solid #d4dbe5;
border-radius:10px;
background:white;
font-size:16px;
outline:none;
margin-bottom:20px;
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:25px;
padding-bottom:5px;
}

.categories button{
white-space:nowrap;
padding:10px 15px;
border:1px solid #d4dbe5;
background:white;
border-radius:20px;
cursor:pointer;
}

.categories button.active{
background:#1677b8;
color:white;
border-color:#1677b8;
}

.tools{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.tool{
background:white;
border:1px solid #e0e5ed;
border-radius:14px;
padding:20px;
cursor:pointer;
transition:.2s;
box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.tool:hover{
transform:translateY(-3px);
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.icon{
font-size:30px;
margin-bottom:10px;
}

.tool h2{
font-size:18px;
margin-bottom:5px;
}

.tool p{
font-size:13px;
color:#667085;
}

.calculator{
display:none;
max-width:650px;
margin:auto;
}

.back{
border:0;
background:#e8edf4;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
margin-bottom:15px;
}

.calc-card{
background:white;
border:1px solid #e0e5ed;
border-radius:16px;
padding:25px;
box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.calc-card h1{
margin-bottom:20px;
font-size:27px;
}

.field{
margin-bottom:15px;
}

.field label{
display:block;
font-size:14px;
font-weight:bold;
margin-bottom:6px;
}

.field input{
width:100%;
padding:13px;
border:1px solid #ccd4df;
border-radius:8px;
font-size:16px;
}

.calculate{
width:100%;
padding:13px;
border:0;
border-radius:9px;
background:#1677b8;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
}

.result{
margin-top:20px;
background:#eef8ff;
border:1px solid #b8e1f8;
border-radius:10px;
padding:18px;
font-size:17px;
font-weight:bold;
color:#075985;
}

.ad{
margin:25px 0;
min-height:90px;
background:#eef1f5;
border:1px dashed #c5ccd7;
display:flex;
align-items:center;
justify-content:center;
color:#8a94a3;
border-radius:10px;
font-size:12px;
}

footer{
background:#101828;
color:#98a2b3;
text-align:center;
padding:30px 15px;
margin-top:20px;
}

@media(max-width:800px){
.tools{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:550px){
.tools{
grid-template-columns:1fr;
}

.hero h1{
font-size:27px;
}

.calc-card{
padding:18px;
}
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
Daily <span>Utility Hub</span>
</div>

<button class="menu" onclick="toggleMenu()">☰</button>

<nav id="nav">

<button onclick="showHome()">🏠 Home</button>
<button onclick="filterTools('Finance')">💰 Finance</button>
<button onclick="filterTools('Construction')">🏗️ Construction</button>
<button onclick="filterTools('Daily')">📅 Daily Life</button>
<button onclick="filterTools('Health')">❤️ Health</button>

</nav>

</div>

</header>


<main class="container">

<!-- HOME -->

<section id="home">

<div class="hero">

<h1>🛠️ Daily Utility Hub</h1>

<p>
Free calculators and useful online tools for everyday life.
</p>

</div>


<input
id="search"
class="search"
placeholder="🔍 Search a tool..."
oninput="searchTools()">


<div class="categories">

<button class="active"
onclick="filterTools('All',this)">
All
</button>

<button onclick="filterTools('Finance',this)">
💰 Finance
</button>

<button onclick="filterTools('Construction',this)">
🏗️ Construction
</button>

<button onclick="filterTools('Daily',this)">
📅 Daily Life
</button>

<button onclick="filterTools('Health',this)">
❤️ Health
</button>

</div>


<div id="tools" class="tools"></div>


<div class="ad">
ADVERTISEMENT
</div>

</section>


<!-- CALCULATOR -->

<section id="calculator" class="calculator">

<button class="back" onclick="showHome()">
← Back to Tools
</button>

<div id="calculatorContent"></div>

</section>

</main>


<footer>

<p>
© 2026 Daily Utility Hub
</p>

<p style="margin-top:7px">
Free Online Tools & Calculators
</p>

</footer>


<script>

const tools=[

{
id:"emi",
name:"EMI Calculator",
category:"Finance",
icon:"💳",
description:"Calculate monthly loan EMI"
},

{
id:"gst",
name:"GST Calculator",
category:"Finance",
icon:"🧾",
description:"Calculate GST amount and total"
},

{
id:"sip",
name:"SIP Calculator",
category:"Finance",
icon:"📈",
description:"Estimate SIP investment value"
},

{
id:"salary",
name:"Salary Calculator",
category:"Finance",
icon:"💼",
description:"Calculate annual and monthly salary"
},

{
id:"percentage",
name:"Percentage Calculator",
category:"Daily",
icon:"％",
description:"Calculate percentage easily"
},

{
id:"age",
name:"Age Calculator",
category:"Daily",
icon:"🎂",
description:"Calculate your exact age"
},

{
id:"date",
name:"Date Calculator",
category:"Daily",
icon:"📅",
description:"Calculate days between dates"
},

{
id:"area",
name:"Area Calculator",
category:"Construction",
icon:"📐",
description:"Calculate area of a rectangle"
},

{
id:"concrete",
name:"Concrete Calculator",
category:"Construction",
icon:"🏗️",
description:"Estimate concrete volume"
},

{
id:"cement",
name:"Cement Calculator",
category:"Construction",
icon:"🧱",
description:"Estimate cement requirement"
},

{
id:"bmi",
name:"BMI Calculator",
category:"Health",
icon:"❤️",
description:"Calculate body mass index"
},

{
id:"unit",
name:"Unit Converter",
category:"Daily",
icon:"🔄",
description:"Convert common units"
}

];


let currentCategory="All";


function renderTools(list=tools){

const box=
document.getElementById("tools");

box.innerHTML=
list.map(tool=>`

<div
class="tool"
onclick="openTool('${tool.id}')">

<div class="icon">
${tool.icon}
</div>

<h2>
${tool.name}
</h2>

<p>
${tool.description}
</p>

</div>

`).join("");

}


function filterTools(category,button){

currentCategory=category;

document
.querySelectorAll(".categories button")
.forEach(x=>x.classList.remove("active"));

if(button)
button.classList.add("active");

const list=
category==="All"
?tools
:tools.filter(x=>x.category===category);

renderTools(list);

showHome();

}


function searchTools(){

const text=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const list=
tools.filter(x=>
(
x.name+" "+
x.description+" "+
x.category
)
.toLowerCase()
.includes(text)
);

renderTools(list);

}


function openTool(id){

document.getElementById("home")
.style.display="none";

document.getElementById("calculator")
.style.display="block";

const content=
document.getElementById("calculatorContent");

if(id==="emi"){

content.innerHTML=`

<div class="calc-card">

<h1>💳 EMI Calculator</h1>

<div class="field">
<label>Loan Amount</label>
<input id="loan" type="number" placeholder="500000">
</div>

<div class="field">
<label>Interest Rate (% per year)</label>
<input id="rate" type="number" step="0.01" placeholder="8.5">
</div>

<div class="field">
<label>Loan Tenure (years)</label>
<input id="years" type="number" placeholder="5">
</div>

<button class="calculate" onclick="calculateEMI()">
Calculate EMI
</button>

<div id="result"></div>

</div>

`;

}

else if(id==="gst"){

content.innerHTML=`

<div class="calc-card">

<h1>🧾 GST Calculator</h1>

<div class="field">
<label>Amount</label>
<input id="gstAmount" type="number" placeholder="10000">
</div>

<div class="field">
<label>GST Rate (%)</label>
<input id="gstRate" type="number" placeholder="18">
</div>

<button class="calculate" onclick="calculateGST()">
Calculate GST
</button>

<div id="result"></div>

</div>

`;

}

else if(id==="percentage"){

content.innerHTML=`

<div class="calc-card">

<h1>％ Percentage Calculator</h1>

<div class="field">
<label>Value</label>
<input id="pValue" type="number">
</div>

<div class="field">
<label>Percentage (%)</label>
<input id="pRate"
