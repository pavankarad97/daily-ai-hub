<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily AI Hub</title>

<meta name="description"
content="Daily AI Hub - India, World, Cricket, Technology, AI and Movies latest news">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b14;
  color:#fff;
  line-height:1.5;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:9999;
  background:#0d1220;
  border-bottom:1px solid #26344f;
  padding:14px 15px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#55c7ff;
}

.menu{
  background:#172238;
  border:1px solid #30405d;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

nav{
  display:none;
  position:absolute;
  right:15px;
  top:64px;
  width:230px;
  background:#111a2b;
  border:1px solid #30405d;
  border-radius:12px;
  padding:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

nav.show{
  display:block;
}

nav button{
  width:100%;
  padding:12px;
  margin-bottom:5px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#fff;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

nav button:hover{
  background:#243451;
}

/* CONTAINER */

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px 50px;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#101a32,#111827);
  border:1px solid #263958;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#aebbd0;
}

.status{
  margin-top:15px;
  color:#69e6a5;
  font-size:14px;
}

/* SEARCH */

.search{
  width:100%;
  padding:14px;
  margin:20px 0;
  border-radius:10px;
  border:1px solid #334563;
  background:#101827;
  color:#fff;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:#55c7ff;
}

/* CATEGORY */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:22px;
  padding-bottom:5px;
}

.categories::-webkit-scrollbar{
  height:4px;
}

.categories button{
  white-space:nowrap;
  border:1px solid #344866;
  background:#121c2e;
  color:#fff;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
}

.categories button.active{
  background:#1677b8;
  border-color:#1677b8;
}

/* SECTION */

.section-title{
  font-size:22px;
  margin-bottom:15px;
}

/* NEWS GRID */

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* CARD */

.card{
  background:#101827;
  border:1px solid #263958;
  border-radius:14px;
  padding:17px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#4c8bc1;
}

.badge{
  display:inline-block;
  font-size:12px;
  background:#193b62;
  color:#66c9ff;
  padding:5px 8px;
  border-radius:6px;
  margin-bottom:10px;
}

.card h2{
  font-size:18px;
  line-height:1.4;
  margin-bottom:10px;
}

.card p{
  color:#9eacc0;
  font-size:13px;
  margin-bottom:12px;
}

.read{
  display:inline-block;
  text-decoration:none;
  background:#1677b8;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  border:0;
  cursor:pointer;
}

.read:hover{
  background:#1d91dc;
}

/* LOADING */

.loading,
.empty{
  text-align:center;
  padding:40px 10px;
  color:#9eacc0;
}

/* DETAIL PAGE */

#detailPage{
  display:none;
}

.detail-box{
  background:#101827;
  border:1px solid #263958;
  border-radius:16px;
  padding:20px;
}

.back-btn{
  display:inline-block;
  border:1px solid #344866;
  background:#172238;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:20px;
  font-size:14px;
}

.detail-category{
  display:inline-block;
  background:#193b62;
  color:#66c9ff;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
  margin-bottom:12px;
}

.detail-title{
  font-size:30px;
  line-height:1.35;
  margin-bottom:12px;
}

.detail-meta{
  color:#9eacc0;
  font-size:14px;
  margin-bottom:20px;
}

.detail-source{
  color:#55c7ff;
}

.detail-message{
  color:#c4cede;
  font-size:16px;
  line-height:1.7;
  padding:20px 0;
  border-top:1px solid #263958;
  border-bottom:1px solid #263958;
  margin-bottom:20px;
}

.original-btn{
  display:inline-block;
  background:#e53935;
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:9px;
  font-weight:bold;
}

.original-btn:hover{
  background:#ff4b47;
}

/* IFRAME */

.news-frame{
  width:100%;
  height:650px;
  border:1px solid #263958;
  border-radius:12px;
  margin-top:20px;
  background:#fff;
}

.frame-title{
  margin-top:20px;
  margin-bottom:8px;
  color:#aebbd0;
  font-size:14px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:25px;
  border-top:1px solid #26344f;
  color:#7e8da5;
  font-size:13px;
}

/* MOBILE */

@media(max-width:650px){

  .news-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:27px;
  }

  .detail-title{
    font-size:23px;
  }

  .news-frame{
    height:550px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header">

    <div class="logo">
      Daily <span>AI Hub</span>
    </div>

    <button class="menu" onclick="toggleMenu()">
      ☰
    </button>

    <nav id="nav">

      <button onclick="goHome();filterNews('All',null)">
        🏠 Home
      </button>

      <button onclick="goHome();filterNews('India',null)">
        🇮🇳 India
      </button>

      <button onclick="goHome();filterNews('World',null)">
        🌎 World
      </button>

      <button onclick="goHome();filterNews('Cricket',null)">
        🏏 Cricket
      </button>

      <button onclick="goHome();filterNews('Technology',null)">
        💻 Technology
      </button>

      <button onclick="goHome();filterNews('AI',null)">
        🤖 AI
      </button>

      <button onclick="goHome();filterNews('Movies',null)">
        🎬 Movies
      </button>

    </nav>

  </div>

</header>


<!-- HOME PAGE -->

<main id="homePage" class="container">

  <section class="hero">

    <h1>
      📰 Daily AI Hub
    </h1>

    <p>
      India, World, Cricket, Technology, AI और Movies की latest news
    </p>

    <div class="status">
      ● Live News Updates
    </div>

  </section>


  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔍 News search करें..."
    oninput="searchNews()"
  >


  <div class="categories">

    <button
      class="active"
      onclick="filterNews('All',this)">
      All
    </button>

    <button
      onclick="filterNews('India',this)">
      🇮🇳 India
    </button>

    <button
      onclick="filterNews('World',this)">
      🌎 World
    </button>

    <button
      onclick="filterNews('Cricket',this)">
      🏏 Cricket
    </button>

    <button
      onclick="filterNews('Technology',this)">
      💻 Technology
    </button>

    <button
      onclick="filterNews('AI',this)">
      🤖 AI
    </button>

    <button
      onclick="filterNews('Movies',this)">
      🎬 Movies
    </button>

  </div>


  <h2 class="section-title">
    🔥 Latest News
  </h2>


  <div id="news" class="news-grid">

    <div class="loading">
      News loading...
    </div>

  </div>

</main>


<!-- DETAIL PAGE -->

<main id="detailPage" class="container">

  <div class="detail-box">

    <button
      class="back-btn"
      onclick="goHome()">
      ← Back to News
    </button>

    <div
      id="detailCategory"
      class="detail-category">
      News
    </div>

    <h1
      id="detailTitle"
      class="detail-title">
      News
    </h1>

    <div
      id="detailMeta"
      class="detail-meta">
    </div>

    <div
      id="detailMessage"
      class="detail-message">
    </div>

    <a
      id="originalLink"
      class="original-btn"
      href="#"
      target="_blank"
      rel="noopener noreferrer">
      🌐 Read Original News
    </a>

    <div
      id="frameArea">
    </div>

  </div>

</main>


<footer>
  © 2026 Daily AI Hub • News & Information
</footer>


<script>

/* ================================
   GLOBAL DATA
================================ */

let allNews = [];

let currentCategory = "All";


/* ================================
   LOAD NEWS
================================ */

async function loadNews(){

  const box = document.getElementById("news");

  try{

    const response =
      await fetch("./news.json?time=" + Date.now());

    if(!response.ok){

      throw new Error(
        "news.json not found"
      );

    }

    const data =
      await response.json();

    allNews =
      Array.isArray(data)
      ? data
      : (data.news || []);

    renderNews(allNews);

  }

  catch(error){

    console.log(error);

    box.innerHTML = `

      <div class="empty">

        <h3>
          News अभी उपलब्ध नहीं है
        </h3>

        <p style="margin-top:10px">
          कृपया थोड़ी देर बाद फिर कोशिश करें।
        </p>

      </div>

    `;

  }

}


/* ================================
   RENDER NEWS
================================ */

function renderNews(list){

  const box =
    document.getElementById("news");

  if(!list.length){

    box.innerHTML = `

      <div class="empty">

        कोई news नहीं मिली।

      </div>

    `;

    return;

  }


  box.innerHTML = list.map(

    (item,index) => {

      const title =
        escapeHTML(
          item.title ||
          "Untitled News"
        );

      const category =
        escapeHTML(
          item.category ||
          "News"
        );

      const source =
        escapeHTML(
          item.source ||
          "News Source"
        );

      const date =
        escapeHTML(
          item.date ||
          ""
        );


      return `

        <article class="card">

          <span class="badge">
            ${category}
          </span>

          <h2>
            ${title}
          </h2>

          <p>
            ${source}
            ${date ? " • " + date : ""}
          </p>

          <button
            class="read"
            onclick="openNews(${index})">

            Read Full News →

          </button>

        </article>

      `;

    }

  ).join("");

}


/* ================================
   OPEN NEWS
================================ */

function openNews(index){

  const item =
    allNews[index];

  if(!item){

    return;

  }


  const title =
    item.title ||
    "Latest News";

  const category =
    item.category ||
    "News";

  const source =
    item.source ||
    "News Source";

  const date =
    item.date ||
    "";

  const url =
    item.link ||
    "";


  document.getElementById(
    "homePage"
  ).style.display = "none";


  document.getElementById(
    "detailPage"
  ).style.display = "block";


  document.getElementById(
    "detailCategory"
  ).textContent = category;


  document.getElementById(
    "detailTitle"
  ).textContent = title;


  document.getElementById(
    "detailMeta"
  ).innerHTML =

    `<span class="detail-source">
      ${escapeHTML(source)}
     </span>
     ${date ? " • " + escapeHTML(date) : ""}`;


  document.getElementById(
    "detailMessage"
  ).innerHTML = `

    <strong>
      📰 ${escapeHTML(title)}
    </strong>

    <br><br>

    यह news Daily AI Hub पर पढ़ने के लिए खोली गई है।

    <br><br>

    नीचे दिए गए Original News button से आप
    पूरी खबर के source पर जा सकते हैं।

  `;


  const original =
    document.getElementById(
      "originalLink"
    );


  if(url){

    original.href = url;

    original.style.display =
      "inline-block";

  }

  else{

    original.style.display =
      "none";

  }


  /* TRY TO SHOW ORIGINAL SITE INSIDE OUR PAGE */

  const frameArea =
    document.getElementById(
      "frameArea"
    );


  frameArea.innerHTML = "";


  if(url){

    const heading =
      document.createElement("div");

    heading.className =
      "frame-title";

    heading.textContent =
      "Original News Preview";

    frameArea.appendChild(
      heading
    );


    const frame =
      document.createElement("iframe");

    frame.className =
      "news-frame";

    frame.src = url;

    frame.loading =
      "lazy";

    frame.referrerPolicy =
      "no-referrer-when-downgrade";

    frameArea.appendChild(
      frame
    );

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================================
   HOME
================================ */

function goHome(){

  document.getElementById(
    "detailPage"
  ).style.display = "none";


  document.getElementById(
    "homePage"
  ).style.display = "block";


  document.getElementById(
    "nav"
  ).classList.remove("show");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================================
   FILTER
================================ */

function filterNews(category,button){

  currentCategory =
    category;


  document
    .querySelectorAll(
      ".categories button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  if(button){

    button.classList.add(
      "active"
    );

  }

  else{

    const buttons =
      document.querySelectorAll(
        ".categories button"
      );

    buttons.forEach(btn => {

      if(
        btn.textContent
        .toLowerCase()
        .includes(
          category.toLowerCase()
        )
      ){

        btn.classList.add(
          "active"
        );

      }

    });

  }


  document.getElementById(
    "search"
  ).value = "";


  if(category === "All"){

    renderNews(
      allNews
    );

  }

  else{

    const filtered =
      allNews.filter(
        item =>

        String(
          item.category || ""
        )
        .toLowerCase()
        .includes(
          category.toLowerCase()
        )

      );


    renderNews(
      filtered
    );

  }

}


/* ================================
   SEARCH
================================ */

function searchNews(){

  const text =
    document.getElementById(
      "search"
    ).value
    .toLowerCase()
    .trim();


  let list =
    allNews;


  if(
    currentCategory !==
    "All"
  ){

    list =
      list.filter(
        item =>

        String(
          item.category || ""
        )
        .toLowerCase()
        .includes(
          currentCategory.toLowerCase()
        )

      );

  }


  if(text){

    list =
      list.filter(
        item =>

        String(
          item.title || ""
        )
        .toLowerCase()
        .includes(text)

      );

  }


  renderNews(
    list
  );

}


/* ================================
   MENU
================================ */

function toggleMenu(){

  document
    .getElementById("nav")
    .classList.toggle(
      "show"
    );

}


/* ================================
   SECURITY
================================ */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ================================
   CLOSE MENU OUTSIDE
================================ */

document.addEventListener(
  "click",
  function(e){

    const nav =
      document.getElementById(
        "nav"
      );

    const menu =
      document.querySelector(
        ".menu"
      );


    if(
      nav.classList.contains("show") &&
      !nav.contains
