<!DOCTYPE html>
<html lang="en">
<head>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.5;
}

button,input{
font-family:inherit;
}

header{
background:#101828;
color:white;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header{
max-width:1100px;
margin:auto;
padding:15px;
display:flex;
align-items:center;

}

.logo{
font-size:23px;

}

.logo span{
color:#39bdf8;
}

.menu{
background:#24324a;
border:1px solid #40516c;

padding:9px 13px;
border-radius:8px;
font-size:20px;

}

nav{
display:none;
position:absolute;
right:15px;
top:65px;
width:240px;
background:#101828;
border:1px solid #34445d;
border-radius:12px;
padding:10px;
}

nav.show{
display:block;
}

nav button{
width:100%;
padding:12px;
background:transparent;
border:0;
color:white;
text-align:left;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

nav button:hover{
background:#24324a;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 15px 50px;
}

.hero{
background:linear-gradient(135deg,#101828,#1d3557);
color:white;
border-radius:18px;
padding:30px 25px;
margin-bottom:25px;
}

.hero h1{
font-size:32px;
margin-bottom:8px;
}

.hero p{
color:#c8d3e2;
font-size:16px;
}

.search{
width:100%;
padding:15px;

border-radius:10px;
background:white;
font-size:16px;

}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:25px;
padding-bottom:5px;
}

.categories button{

padding:10px 15px;

background:white;
border-radius:20px;
cursor:pointer;
}

.categories button.active{
background:#1677b8;
color:white;
border-color:#1677b8;
}

.section-title{
font-size:22px;
margin-bottom:15px;
}

.tools{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.tool{
background:white;
border:1px solid #e0e5ed;
border-radius:14px;
padding:20px;
cursor:pointer;
transition:.2s;
box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.tool:hover{
transform:translateY(-3px);
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.icon{
font-size:30px;
margin-bottom:10px;
}

.tool h2{
font-size:18px;
margin-bottom:5px;
}

.tool p{
font-size:13px;
color:#667085;
}

.popular{
margin-bottom:30px;
}

.calculator{
display:none;
max-width:650px;
margin:auto;
}

.back{
border:0;
background:#e8edf4;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
margin-bottom:15px;
}

.calc-card{
background:white;
border:1px solid #e0e5ed;
border-radius:16px;
padding:25px;
box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.calc-card h1{
margin-bottom:20px;
font-size:27px;
}

.field{
margin-bottom:15px;
}

.field label{
display:block;
font-size:14px;
font-weight:bold;
margin-bottom:6px;
}

.field input{
width:100%;
padding:13px;
border:1px solid #ccd4df;
border-radius:8px;
font-size:16px;
}

.calculate{
width:100%;
padding:13px;
border:0;
border-radius:9px;
background:#1677b8;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
}

.result{
margin-top:20px;
background:#eef8ff;
border:1px solid #b8e1f8;
border-radius:10px;
padding:18px;
font-size:17px;
font-weight:bold;
color:#075985;
line-height:1.8;
}

.result-actions{
display:flex;
gap:8px;
margin-top:10px;
}

.action{
flex:1;
padding:10px;
border:1px solid #ccd4df;
background:white;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.action:hover{
background:#f1f5f9;
}

.ad{
margin:25px 0;
min-height:90px;
background:#eef1f5;
border:1px dashed #c5ccd7;
display:flex;
align-items:center;
justify-content:center;
color:#8a94a3;
border-radius:10px;
font-size:12px;
}

footer{
background:#101828;
color:#98a2b3;
text-align:center;
padding:30px 15px;
margin-top:20px;
}

footer a{
color:#67c9ff;
text-decoration:none;
margin:0 5px;
}

@media(max-width:800px){

.tools{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:550px){

.tools{
grid-template-columns:1fr;
}

.hero h1{
font-size:27px;
}

.calc-card{
padding:18px;
}

.result-actions{
flex-direction:column;
}

}
</style>
</head>

<body>

<main class="container">


<!-- HOME -->

<section id="home">

<script>

{

{

{

{

{

},

{

category:"Construction",

description:"Estimate cement requirement"
},

{
id:"bmi",
name:"BMI Calculator",
category:"Health",
icon:"❤️",
description:"Calculate body mass index"
}

];


let currentCategory="All";


/* ==========================================
   RENDER
========================================== */

function renderTools(list=tools){

const box=
document.getElementById("tools");

box.innerHTML=
list.map(tool=>`

<div
class="tool"
onclick="openTool('${tool.id}')">

<div class="icon">
${tool.icon}
</div>

<h2>
${tool.name}
</h2>

<p>
${tool.description}
</p>

</div>

`).join("");

}


/* POPULAR */

function renderPopular(){

const ids=[
"emi",
"sip",
"gst",
"fd",
"discount",
"percentage"
];

const popular=
ids.map(id=>
tools.find(x=>x.id===id)
).filter(Boolean);

document.getElementById(
"popularTools"
).innerHTML=
popular.map(tool=>`

<div
class="tool"
onclick="openTool('${tool.id}')">

<div class="icon">
${tool.icon}
</div>

<h2>
${tool.name}
</h2>

<p>
${tool.description}
</p>

</div>

`).join("");

}


/* FILTER */

function filterTools(category,button){

currentCategory=category;

document
.querySelectorAll(".categories button")
.forEach(x=>
x.classList.remove("active")
);

if(button){
button.classList.add("active");
}

const list=
category==="All"
?tools
:tools.filter(
x=>x.category===category
);

renderTools(list);

document.getElementById(
"popularTools"
).style.display=
category==="All"
?"grid"
:"none";

showHome();

}


/* SEARCH */

function searchTools(){

const text=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const list=
tools.filter(x=>
(
x.name+
" "+
x.description+
" "+
x.category
)
.toLowerCase()
.includes(text)
);

renderTools(list);

}


/* ==========================================
   OPEN TOOL
========================================== */

function openTool(id){

document.getElementById("home")
.style.display="none";

document.getElementById("calculator")
.style.display="block";

const content=
document.getElementById(
"calculatorContent"
);


/* EMI */

if(id==="emi"){

content.innerHTML=`

<div class="calc-card">

<h1>💳 EMI Calculator</h1>

${input("loan","Loan Amount","500000")}
${input("rate","Interest Rate (% per year)","8.5")}
${input("years","Loan Tenure (years)","5")}

<button class="calculate"
onclick="calculateEMI()">
Calculate EMI
</button>

<div id="result"></div>

</div>`;

}


/* SIP */

else if(id==="sip"){

content.innerHTML=`

<div class="calc-card">

<h1>📈 SIP Calculator</h1>

${input("sipAmount","Monthly Investment","5000")}
${input("sipRate","Expected Annual Return (%)","12")}
${input("sipYears","Investment Period (years)","10")}

<button class="calculate"
onclick="calculateSIP()">
Calculate SIP
</button>

</div>`;

}


/* FD */

else if(id==="fd"){

content.innerHTML=`

<div class="calc-card">

<h1>🏦 FD Calculator</h1>

${input("fdPrincipal","Deposit Amount","100000")}
${input("fdRate","Interest Rate (% per year)","7")}
${input("fdYears","Tenure (years)","5")}

onclick="calculateFD()">
Calculate FD

</button>

}


/* RD */

else if(id==="rd"){

content.innerHTML=`

<div class="calc-card">

}


/* GST */

else if(id==="gst"){

content.innerHTML=`

<div class="calc-card">

<h1>🧾 GST Calculator</h1>

onclick="calculateSalary()">

</button>

/* PERCENTAGE */

else if(id==="percentage"){

content.innerHTML=`

<div class="calc-card">

<h1>％ Percentage Calculator</h1>

${input("pValue","Value","1000")}
${input("pRate","Percentage (%)","20")}

<button class="calculate"
onclick="calculatePercentage()">

else if(id==="age"){

content.innerHTML=`

<div class="calc-card">

<div class="field">

<label>Date of Birth</label>

<input
id="dob"
type="date">

</div>

onclick="calculateAge()">

/* DATE */

else if(id==="date"){

content.innerHTML=`

<div class="calc-card">

<div class="field">

<label>Start Date</label>

<input
id="date1"

</div>

/* CONCRETE */

else if(id==="concrete"){

content.innerHTML=`

<div class="calc-card">

<h1>🏗
