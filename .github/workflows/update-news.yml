name: Daily AI Hub News Update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Google GenAI
        run: pip install -q google-genai

      - name: Fetch and process news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          from google import genai

          # -----------------------------
          # NEWS SOURCES / SEARCHES
          # -----------------------------

          feeds = [
              ("India", "India latest news", "en"),
              ("India", "भारत की ताज़ा खबरें", "hi"),
              ("India", "महाराष्ट्र ताज़ा खबरें", "mr"),

              ("Trending", "India trending news", "en"),
              ("Trending", "भारत trending news", "hi"),

              ("World", "world latest news", "en"),

              ("Cricket", "cricket latest news", "en"),
              ("Cricket", "भारत क्रिकेट", "hi"),

              ("Technology", "technology latest news", "en"),
              ("AI", "artificial intelligence latest news", "en"),

              ("Movies", "Indian movies latest news", "en"),
              ("Movies", "Bollywood latest news", "hi"),
              ("Movies", "South Indian movies latest", "en")
          ]

          news = []
          seen = set()

          # -----------------------------
          # GOOGLE NEWS RSS
          # -----------------------------

          for category, query, language in feeds:
              try:
                  q = urllib.parse.quote(query)

                  lang_map = {
                      "en": ("en-IN", "IN", "IN:en"),
                      "hi": ("hi", "IN", "IN:hi"),
                      "mr": ("mr", "IN", "IN:mr")
                  }

                  hl, gl, ceid = lang_map.get(
                      language,
                      ("en-IN", "IN", "IN:en")
                  )

                  url = (
                      "https://news.google.com/rss/search?"
                      f"q={q}&hl={hl}&gl={gl}&ceid={ceid}"
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  data = urllib.request.urlopen(
                      request,
                      timeout=20
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item")[:8]:

                      title = item.findtext(
                          "title", ""
                      ).strip()

                      link = item.findtext(
                          "link", ""
                      ).strip()

                      pub_date = item.findtext(
                          "pubDate", ""
                      ).strip()

                      if not title or not link:
                          continue

                      key = title.lower().strip()

                      if key in seen:
                          continue

                      seen.add(key)

                      news.append({
                          "title": title,
                          "link": link,
                          "originalLink": link,
                          "date": pub_date,
                          "category": category,
                          "language": language,
                          "source": "Google News",
                          "summary": "",
                          "translations": {}
                      })

              except Exception as error:
                  print(
                      "RSS error:",
                      query,
                      error
                  )

          # Keep latest 40
          news = news[:40]

          print(
              "News collected:",
              len(news)
          )

          # -----------------------------
          # GEMINI
          # -----------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret not found"
              )

          client = genai.Client(
              api_key=api_key
          )

          # -----------------------------
          # PROCESS NEWS
          # -----------------------------

          for number, item in enumerate(news, 1):

              print(
                  f"AI processing {number}/{len(news)}:",
                  item["title"]
              )

              prompt = f"""
          You are the editorial AI for Daily AI Hub.

          Search the web for the latest reliable information
          about this news story.

          Use multiple reliable sources when available.
          Prefer original reporting and official sources.

          Create a factual short news story of about 100 words.

          Rules:
          - Do not invent facts.
          - Do not invent quotes.
          - Do not copy articles word-for-word.
          - Clearly separate confirmed facts from claims.
          - Use recent information.
          - Mention important context when available.
          - Keep it suitable for a general news website.

          Original news headline:
          {item["title"]}

          Original news link:
          {item["link"]}

          Original publication date:
          {item["date"]}

          Return ONLY valid JSON in this exact format:

          {{
            "en_title": "English headline",
            "en_summary": "About 100 words in English",

            "hi_title": "Hindi headline",
            "hi_summary": "About 100 words in Hindi",

            "mr_title": "Marathi headline",
            "mr_summary": "About 100 words in Marathi",

            "ta_title": "Tamil headline",
            "ta_summary": "Tamil news summary",

            "te_title": "Telugu headline",
            "te_summary": "Telugu news summary",

            "bn_title": "Bengali headline",
            "bn_summary": "Bengali news summary",

            "kn_title": "Kannada headline",
            "kn_summary": "Kannada news summary",

            "ml_title": "Malayalam headline",
            "ml_summary": "Malayalam news summary",

            "gu_title": "Gujarati headline",
            "gu_summary": "Gujarati news summary",

            "pa_title": "Punjabi headline",
            "pa_summary": "Punjabi news summary",

            "sources": [
              {{
                "name": "Source name",
                "url": "https://example.com"
              }}
            ]
          }}
          """

              try:

                  response = client.models.generate_content(
                      model="gemini-2.5-flash",
                      contents=prompt,
                      config={
                          "tools": [
                              {
                                  "google_search": {}
                              }
                          ],
                          "temperature": 0.2
                      }
                  )

                  text = response.text.strip()

                  # Remove markdown JSON fences if present
                  if text.startswith("```"):
                      text = text.replace(
                          "```json", ""
                      ).replace(
                          "```", ""
                      ).strip()

                  result = json.loads(text)

                  item["translations"] = {
                      "en": {
                          "title": result.get(
                              "en_title", ""
                          ),
                          "summary": result.get(
                              "en_summary", ""
                          )
                      },
                      "hi": {
                          "title": result.get(
                              "hi_title", ""
                          ),
                          "summary": result.get(
                              "hi_summary", ""
                          )
                      },
                      "mr": {
                          "title": result.get(
                              "mr_title", ""
                          ),
                          "summary": result.get(
                              "mr_summary", ""
                          )
                      },
                      "ta": {
                          "title": result.get(
                              "ta_title", ""
                          ),
                          "summary": result.get(
                              "ta_summary", ""
                          )
                      },
                      "te": {
                          "title": result.get(
                              "te_title", ""
                          ),
                          "summary": result.get(
                              "te_summary", ""
                          )
                      },
                      "bn": {
                          "title": result.get(
                              "bn_title", ""
                          ),
                          "summary": result.get(
                              "bn_summary", ""
                          )
                      },
                      "kn": {
                          "title": result.get(
                              "kn_title", ""
                          ),
                          "summary": result.get(
                              "kn_summary", ""
                          )
                      },
                      "ml": {
                          "title": result.get(
                              "ml_title", ""
                          ),
                          "summary": result.get(
                              "ml_summary", ""
                          )
                      },
                      "gu": {
                          "title": result.get(
                              "gu_title", ""
                          ),
                          "summary": result.get(
                              "gu_summary", ""
                          )
                      },
                      "pa": {
                          "title": result.get(
                              "pa_title", ""
                          ),
                          "summary": result.get(
                              "pa_summary", ""
                          )
                      }
                  }

                  item["summary"] = result.get(
                      "en_summary", ""
                  )

                  item["sources"] = result.get(
                      "sources", []
                  )

              except Exception as error:

                  print(
                      "Gemini error:",
                      error
                  )

                  # Keep the news even if AI fails
                  item["summary"] = ""

              # Small delay
              time.sleep(1)

          # -----------------------------
          # SAVE
          # -----------------------------

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "total": len(news),

              "news": news
          }

          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "news.json created successfully"
          )
          PY

      - name: Commit updated news
        run: |
          git config user.name "Daily AI Hub Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes"
          else
            git commit -m "Auto update news"
            git push
          fi
