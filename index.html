<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<meta name="description" content="Daily AI Hub - Indian and Global News, Cricket, Movies, Technology and Trending Updates">
<title>🤖 Daily AI Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b14;
  color:#fff;
  line-height:1.5;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#0d1120;
  border-bottom:1px solid #292f4a;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#6c63ff;
}

.menu{
  font-size:30px;
  cursor:pointer;
}

nav{
  display:none;
  position:absolute;
  right:15px;
  top:70px;
  width:220px;
  background:#151a2c;
  border:1px solid #30364d;
  border-radius:14px;
  padding:10px;
}

nav.show{
  display:block;
}

nav a{
  display:block;
  color:white;
  text-decoration:none;
  padding:13px;
  border-radius:8px;
}

nav a:hover{
  background:#252b43;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 16px 60px;
}

.hero{
  text-align:center;
  padding:55px 10px 45px;
}

.badge{
  display:inline-block;
  padding:9px 16px;
  border:1px solid #3c4265;
  background:#171b32;
  color:#9d96ff;
  border-radius:30px;
  margin-bottom:18px;
}

.hero h1{
  font-size:48px;
  margin-bottom:15px;
}

.hero p{
  color:#aeb5ca;
  font-size:20px;
  max-width:750px;
  margin:auto;
}

.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:28px;
}

.btn{
  display:inline-block;
  padding:16px 25px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
  font-size:17px;
  border:1px solid #3b4164;
  color:white;
  background:#151a2c;
}

.btn.primary{
  background:#6559f5;
  border-color:#6559f5;
}

.section{
  margin-top:35px;
}

.section-title{
  font-size:32px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:#111526;
  border:1px solid #292f49;
  border-radius:18px;
  padding:22px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#5e57d9;
}

.card h3{
  font-size:20px;
  margin:12px 0;
}

.card p{
  color:#aeb5ca;
}

.tag{
  display:inline-block;
  padding:6px 10px;
  border-radius:8px;
  background:#272d48;
  color:#9d96ff;
  font-size:12px;
  font-weight:bold;
}

.breaking{
  border:1px solid #8d3150;
  background:linear-gradient(135deg,#21131d,#111526);
}

.breaking .tag{
  background:#e52d55;
  color:white;
}

.news-card{
  cursor:pointer;
}

.source{
  color:#777f98;
  font-size:13px;
  margin-top:10px;
}

.read{
  display:inline-block;
  margin-top:15px;
  color:#8d84ff;
  font-weight:bold;
  text-decoration:none;
}

.empty{
  text-align:center;
  padding:30px;
  color:#9299ae;
}

footer{
  border-top:1px solid #252b40;
  text-align:center;
  padding:30px 15px;
  color:#737b92;
}

@media(max-width:600px){
  .hero h1{
    font-size:38px;
  }

  .hero p{
    font-size:18px;
  }

  .section-title{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖 Daily <span>AI Hub</span></div>

  <div class="menu" onclick="toggleMenu()">☰</div>

  <nav id="menu">
    <a href="#home">🏠 Home</a>
    <a href="#trending">
