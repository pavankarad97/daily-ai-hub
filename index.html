<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily AI Hub</title>

<meta name="description"
content="Daily AI Hub - India, World, Cricket, Technology, AI and Movies latest news">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b14;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#0d1220;
  border-bottom:1px solid #26344f;
  padding:15px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#55c7ff;
}

.menu{
  background:#172238;
  border:1px solid #30405d;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}

nav{
  display:none;
  position:absolute;
  right:15px;
  top:65px;
  width:220px;
  background:#111a2b;
  border:1px solid #30405d;
  border-radius:12px;
  padding:10px;
}

nav.show{
  display:block;
}

nav button{
  width:100%;
  padding:12px;
  margin-bottom:5px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#fff;
  text-align:left;
  font-size:15px;
}

nav button:hover{
  background:#243451;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px 50px;
}

.hero{
  background:linear-gradient(135deg,#101a32,#111827);
  border:1px solid #263958;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#aebbd0;
}

.status{
  margin-top:15px;
  color:#69e6a5;
  font-size:14px;
}

.search{
  width:100%;
  padding:14px;
  margin:20px 0;
  border-radius:10px;
  border:1px solid #334563;
  background:#101827;
  color:#fff;
  font-size:16px;
  outline:none;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:22px;
  padding-bottom:5px;
}

.categories button{
  white-space:nowrap;
  border:1px solid #344866;
  background:#121c2e;
  color:#fff;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
}

.categories button.active{
  background:#1677b8;
  border-color:#1677b8;
}

.section-title{
  font-size:22px;
  margin-bottom:15px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:#101827;
  border:1px solid #263958;
  border-radius:14px;
  padding:17px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#4c8bc1;
}

.badge{
  display:inline-block;
  font-size:12px;
  background:#193b62;
  color:#66c9ff;
  padding:5px 8px;
  border-radius:6px;
  margin-bottom:10px;
}

.card h2{
  font-size:18px;
  line-height:1.4;
  margin-bottom:10px;
}

.card p{
  color:#9eacc0;
  font-size:13px;
  margin-bottom:12px;
}

.read{
  display:inline-block;
  text-decoration:none;
  color:#63c9ff;
  font-size:14px;
  font-weight:bold;
}

.loading,
.empty{
  text-align:center;
  padding:40px 10px;
  color:#9eacc0;
}

footer{
  text-align:center;
  padding:25px;
  border-top:1px solid #26344f;
  color:#7e8da5;
  font-size:13px;
}

@media(max-width:650px){
  .news-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      Daily <span>AI Hub</span>
    </div>

    <button class="menu" onclick="toggleMenu()">
      ☰
    </button>

    <nav id="nav">
      <button onclick="filterNews('All')">🏠 Home</button>
      <button onclick="filterNews('India')">🇮🇳 India</button>
      <button onclick="filterNews('World')">🌎 World</button>
      <button onclick="filterNews('Cricket')">🏏 Cricket</button>
      <button onclick="filterNews('Technology')">💻 Technology</button>
      <button onclick="filterNews('AI')">🤖 AI</button>
      <button onclick="filterNews('Movies')">🎬 Movies</button>
    </nav>

  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>📰 Daily AI Hub</h1>
    <p>
      India, World, Cricket, Technology, AI और Movies की latest news
    </p>

    <div class="status">
      ● Live News Updates
    </div>
  </section>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔍 News search करें..."
    oninput="searchNews()"
  >

  <div class="categories">

    <button class="active" onclick="filterNews('All',this)">
      All
    </button>

    <button onclick="filterNews('India',this)">
      🇮🇳 India
    </button>

    <button onclick="filterNews('World',this)">
      🌎 World
    </button>

    <button onclick="filterNews('Cricket',this)">
      🏏 Cricket
    </button>

    <button onclick="filterNews('Technology',this)">
      💻 Technology
    </button>

    <button onclick="filterNews('AI',this)">
      🤖 AI
    </button>

    <button onclick="filterNews('Movies',this)">
      🎬 Movies
    </button>

  </div>

  <h2 class="section-title">
    🔥 Latest News
  </h2>

  <div id="news" class="news-grid">
    <div class="loading">
      News loading...
    </div>
  </div>

</main>

<footer>
  © 2026 Daily AI Hub • News & Information
</footer>

<script>

let allNews = [];
let currentCategory = "All";

async function loadNews(){

  const box = document.getElementById("news");

  try{

    const response = await fetch("./news.json?time=" + Date.now());

    if(!response.ok){
      throw new Error("news.json not found");
    }

    const data = await response.json();

    allNews = Array.isArray(data)
      ? data
      : (data.news || []);

    renderNews(allNews);

  }catch(error){

    console.log(error);

    box.innerHTML = `
      <div class="empty">
        <h3>News अभी उपलब्ध नहीं है</h3>
        <p style="margin-top:10px">
          कृपया थोड़ी देर बाद फिर कोशिश करें।
        </p>
      </div>
    `;
  }
}

function renderNews(list){

  const box = document.getElementById("news");

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        कोई news नहीं मिली।
      </div>
    `;

    return;
  }

  box.innerHTML = list.map(item => {

    const title = escapeHTML(item.title || "Untitled News");

    const category = escapeHTML(
      item.category || "News"
    );

    const source = escapeHTML(
      item.source || "News Source"
    );

    const date = escapeHTML(
      item.date || ""
    );

    const link = item.link || "#";

    return `
      <article class="card">

        <span class="badge">
          ${category}
        </span>

        <h2>
          ${title}
        </h2>

        <p>
          ${source}${date ? " • " + date : ""}
        </p>

        ${
          link !== "#"
          ? `<a class="read"
               href="${link}"
               target="_blank"
               rel="noopener noreferrer">
               Read Full News →
             </a>`
          : ""
        }

      </article>
    `;

  }).join("");
}

function filterNews(category,button){

  currentCategory = category;

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

  document.getElementById("search").value = "";

  if(category === "All"){
    renderNews(allNews);
  }else{

    const filtered = allNews.filter(item =>
      String(item.category || "")
        .toLowerCase()
        .includes(category.toLowerCase())
    );

    renderNews(filtered);
  }
}

function searchNews(){

  const text =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  let list = allNews;

  if(currentCategory !== "All"){

    list = list.filter(item =>
      String(item.category || "")
      .toLowerCase()
      .includes(currentCategory.toLowerCase())
    );
  }

  if(text){

    list = list.filter(item =>
      String(item.title || "")
      .toLowerCase()
      .includes(text)
    );
  }

  renderNews(list);
}

function toggleMenu(){

  document
    .getElementById("nav")
    .classList.toggle("show");
}

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

loadNews();

</script>

</body>
</html>
