<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Daily AI Hub - Latest AI News, Tools, Facts and Technology Updates">

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b14;
  color:#fff;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px;
  background:#0d1120;
  border-bottom:1px solid #262b3d;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#6c63ff;
}

.menu{
  font-size:28px;
  cursor:pointer;
  user-select:none;
}

nav{
  display:none;
  position:absolute;
  right:15px;
  top:70px;
  background:#15192b;
  border:1px solid #30364d;
  border-radius:14px;
  padding:12px;
  width:190px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

nav.show{
  display:block;
}

nav a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:13px;
  border-radius:9px;
}

nav a:hover{
  background:#252a43;
  color:#8f88ff;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:20px 16px 60px;
}

.hero{
  text-align:center;
  padding:65px 10px 50px;
}

.badge{
  display:inline-block;
  background:#171b32;
  border:1px solid #414875;
  color:#aaa5ff;
  padding:10px 16px;
  border-radius:30px;
  font-size:14px;
  margin-bottom:18px;
}

h1{
  font-size:clamp(38px,8vw,64px);
  line-height:1.05;
  margin-bottom:18px;
}

.hero p{
  color:#aeb4c8;
  font-size:18px;
  line-height:1.7;
  max-width:700px;
  margin:auto;
}

.search{
  display:flex;
  max-width:700px;
  margin:30px auto 0;
  background:#121628;
  border:1px solid #303650;
  border-radius:18px;
  overflow:hidden;
}

.search input{
  flex:1;
  min-width:0;
  padding:18px;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  font-size:16px;
}

.search button{
  border:0;
  padding:0 25px;
  background:#635bff;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 20px;
}

.section-title h2{
  font-size:28px;
}

.status{
  color:#9da4bc;
  font-size:14px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:18px;
}

.card{
  background:#121627;
  border:1px solid #292f47;
  border-radius:20px;
  padding:24px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#635bff;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.card-number{
  color:#8d87ff;
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}

.card h3{
  font-size:20px;
  line-height:1.4;
  margin-bottom:13px;
}
